<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Huella</title>
  <meta name="description" content="Escalas de valoración geriátrica integral: cálculo, interpretación y texto para el expediente.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Huella">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
    try {
      var t = JSON.parse(localStorage.getItem('huella.tema') || '"auto"');
      if (t === 'claro') document.documentElement.dataset.theme = 'light';
      if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body data-vista="inicio">
  <a class="saltar" href="#vista" onclick="document.getElementById('vista').focus(); return false;">Saltar al contenido</a>
  <div class="app">
    <aside class="lateral" id="lateral" aria-label="Navegación"></aside>
    <div class="principal">
      <header class="barra" id="barra"></header>
      <main id="vista" tabindex="-1">
        <noscript><p style="padding:24px">Huella necesita JavaScript activado.</p></noscript>
      </main>
    </div>
    <nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>
  </div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
